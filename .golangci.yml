version: "2"
run:
  tests: true
  build-tags:
    - integration
    - migration

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - gochecknoinits
    - unparam
    - gosec
    - whitespace
    - bodyclose
    - gocyclo
  settings:
    gocyclo:
      # https://github.com/kubeshop/botkube/issues/745
      # Merging slack and discord test cases increased cyclo due to if conditions
      min-complexity: 55
    revive:
      rules:
        # Disable warns about capitalized and ended with punctuation error messages
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#error-strings
        - name: error-strings
          disabled: true
        # Disable package comment requirement - many packages intentionally don't have them
        - name: package-comments
          disabled: true
        # Disable exported symbol comment requirement - too noisy for this codebase
        - name: exported
          disabled: true
        # Disable unused parameter warnings - interface implementations often have unused params
        - name: unused-parameter
          disabled: true
        # Disable redefines-builtin-id - handled separately
        - name: redefines-builtin-id
          disabled: true
        # Disable stutter detection - some package-prefixed names are intentional
        - name: var-naming
          disabled: true
  exclusions:
    generated: lax
    paths:
      - ".*\\.generated\\.go$"
      - megalinter-reports
    rules:
      # Read more: https://github.com/kyoh86/scopelint/issues/4
      - text: "Using the variable on range scope `tc` in function literal"
        linters:
          - scopelint
      # EXC0001 errcheck: source: https://github.com/kubernetes-sigs/controller-runtime/blob/master/.golangci.yml#L94
      - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"
        linters:
          - errcheck
      # EXC0008 gosec: Duplicated errcheck checks
      - text: "(G104|G307)"
        linters:
          - gosec
      # G505: Blocklisted import crypto/sha1: weak cryptographic primitive
      # This is used just for hashing in ArgoCD plugin
      - text: "G505"
        linters:
          - gosec
      # G115: integer overflow conversions that are pre-existing and intentional
      - text: "G115"
        linters:
          - gosec
      # SA1019: deprecation warnings for pre-existing usages
      - text: "SA1019"
        linters:
          - staticcheck
      # QF: quick-fix suggestions that are pre-existing style choices
      - text: "QF1"
        linters:
          - staticcheck
      # ST1005: error string capitalization/punctuation (pre-existing style)
      - text: "ST1005"
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # put imports beginning with prefix after 3rd-party packages;
      # it's a comma-separated list of prefixes
      local-prefixes: github.com/kubeshop/botkube
  exclusions:
    generated: lax
    paths:
      - ".*\\.generated\\.go$"
      - megalinter-reports
