name: Release
on:
  push:
    tags:
      - "*"

env:
  git-user: github-actions[bot]
  git-email: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      pull-requests: read
      issues: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker Login
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GoReleaser Env
        run: |
          echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY_OWNER}/botkube" >> "$GITHUB_ENV"

      - name: Extract Previous Version
        id: prev-version
        run: |
          BASE_TAG=$(echo "${{ github.ref_name }}" | awk -F- '{print $1}')
          git fetch origin "refs/notes/*:refs/notes/*"
          BASE_VERSION=$(echo "${BASE_TAG}" | cut -c2- |  awk 'BEGIN{FS=OFS="."}NF--')
          PREV_VERSION=$(git log --pretty=format:"%N" --show-notes="release-${BASE_VERSION}"| awk -F',' '{ print $1 }' | awk NF | awk '{ print $2 }')
          # Guard against a missing or malformed note. Passing a non-existent
          # tag to the generate-notes API fails with HTTP 400, so leave the
          # value empty and let GitHub pick the previous tag itself.
          if [ -n "$PREV_VERSION" ] && ! git rev-parse -q --verify "refs/tags/${PREV_VERSION}" >/dev/null; then
            echo "Previous version '${PREV_VERSION}' is not an existing tag, letting GitHub select it"
            PREV_VERSION=""
          fi
          echo "previous-version=$PREV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build plugins and generate plugins index.yaml
        env:
          PLUGIN_DOWNLOAD_URL_BASE_PATH: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          OUTPUT_MODE: "archive"
        run: |
          make gen-plugins-index

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_VERSION="${{ steps.prev-version.outputs.previous-version }}"
          ARGS=()
          if [ -n "$PREV_VERSION" ]; then
            ARGS+=(-f "previous_tag_name=${PREV_VERSION}")
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF#refs/tags/}" \
            "${ARGS[@]}" \
            -q .body > CHANGELOG.md

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          goreleaser release --clean --release-notes=CHANGELOG.md
