# MegaLinter configuration file
# https://megalinter.io/latest/configuration/

# Pass --offline to lychee so it only checks local file links
# and skips all external HTTP/HTTPS URL requests
SPELL_LYCHEE_ARGUMENTS: "--offline"

COPYPASTE_JSCPD_ARGUMENTS: "--threshold 9"

# don't even bother running these they are useless
DISABLE_LINTERS:
  - SPELL_CSPELL
  # temporarily disable golangci-linter because it's not compatible with newer Go
  - GO_GOLANGCI_LINT

DISABLE_ERRORS_LINTERS:
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM

# zizmor needs to call the GitHub API to perform the ref-confusion audit;
# without GITHUB_TOKEN it gets 401-rate-limited and fails the whole job.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

FLAVOR_SUGGESTIONS: false

REPOSITORY_TRIVY_ARGUMENTS: "--ignorefile .megalinter/.trivyignore --skip-dirs examples --skip-dirs megalinter-reports"
REPOSITORY_TRIVY_SBOM_ARGUMENTS: "--ignorefile .megalinter/.trivyignore"
REPOSITORY_KICS_ARGUMENTS: "--config .megalinter/kics-config.yaml"
REPOSITORY_GRYPE_ARGUMENTS: "--config .megalinter/.grype.yaml"
GO_GOLANGCI_LINT_ARGUMENTS: "--config .megalinter/.golangci.yml"

